<!DOCTYPE html>
<html>
<head>
    <title>Add Car</title>
</head>
<body>
    <h1>Add New Car Record</h1>

    <form method="POST">
        <p>Car ID: <input type="text" name="car_id" required></p>
        <p>Brand: <input type="text" name="brand" required></p>
        <p>Model: <input type="text" name="model" required></p>
        <p>Year: <input type="number" name="year" required></p>
        <p>Price: <input type="number" name="price" required></p>
        <p>Sale Date: <input type="text" name="sale_date" required></p>
        <p>Dealer Location: <input type="text" name="dealer_location" required></p>
        <p>Customer City: <input type="text" name="customer_city" required></p>
        <p>Salesperson: <input type="text" name="salesperson" required></p>
        <p>Status: <input type="text" name="status" value="Sold" required></p>
        <button type="submit">Add Record</button>
    </form>

    <p><a href="/">Back to Home</a></p>
</body>
</html>
